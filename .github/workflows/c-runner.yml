name: HiCommit C Runner

on:
  workflow_call:
    inputs:
      api_base_url:
        description: HiCommit backend base URL
        required: true
        type: string

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout student source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Grade and deliver result
        env:
          HICOMMIT_API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          python3 - <<'PYTHON'
          """Embedded in c-runner.yml; stdlib only. Student code runs in a networkless container."""
          import base64
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid

          TIMEOUT_MS = 2000
          OUTPUT_LIMIT = 32768
          IMAGE = 'gcc@sha256:6f37e44a9b41181de5dd97366ec732652f5d895a72b5549c64694efed50a97e8'

          class InfrastructureError(Exception):
              pass

          def request(method, url, data=None, headers=None):
              """Never redirect a bearer token to another host."""
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args):
                      return None
              req = urllib.request.Request(url, data=data, headers=headers or {}, method=method)
              return urllib.request.build_opener(NoRedirect).open(req, timeout=20)

          def oidc_token():
              url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
              separator = '&' if '?' in url else '?'
              with request('GET', url + separator + 'audience=hicommit-backend', headers={
                  'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
              }) as response:
                  token = json.load(response)['value']
              # Token is not written to GITHUB_ENV, payload files, artifacts, or subprocess environments.
              print('::add-mask::' + token, flush=True)
              return token

          def api(method, url, payload=None, attempts=4):
              encoded = None if payload is None else json.dumps(payload, ensure_ascii=False).encode('utf-8')
              for attempt in range(attempts):
                  try:
                      token = oidc_token()  # Fresh token for each retry, including a late final callback.
                      with request(method, url, encoded, {'Authorization': 'Bearer ' + token,
                                                         'Content-Type': 'application/json'}) as response:
                          body = response.read()
                          return json.loads(body) if body else None
                  except urllib.error.HTTPError as error:
                      retryable = error.code in (408, 429) or error.code >= 500
                      print(f'Callback HTTP {error.code}, attempt {attempt + 1}/{attempts}', flush=True)
                      if not retryable or attempt + 1 == attempts:
                          raise InfrastructureError(f'API returned HTTP {error.code}') from None
                      retry_after = error.headers.get('Retry-After', '')
                      delay = min(30, int(retry_after)) if retry_after.isdigit() else 2 ** (attempt + 1)
                  except (OSError, ValueError, KeyError) as error:
                      if attempt + 1 == attempts:
                          raise InfrastructureError('API/OIDC unavailable after bounded retries') from error
                      delay = 2 ** (attempt + 1)
                  time.sleep(delay)

          def sandbox(command, mounts, output, timeout, input_data=b''):
              name = 'hicommit-' + uuid.uuid4().hex
              args = ['docker', 'run', '-i', '--rm', '--name', name, '--network', 'none', '--read-only',
                      '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges', '--memory', '256m',
                      '--pids-limit', '32', '--cpus', '1', '--user', '65534:65534',
                      '--tmpfs', '/tmp:rw,noexec,nosuid,size=64m', '--ulimit', 'fsize=1048576:1048576']
              for source, target, mode in mounts:
                  args += ['--mount', f'type=bind,source={source},target={target},{mode}']
              args += [IMAGE, 'sh', '-c', command]
              timed_out = False
              started = time.monotonic()
              try:
                  proc = subprocess.run(args, input=input_data, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                        timeout=timeout, env=clean_env())
                  exit_code = proc.returncode
                  if exit_code == 125:
                      raise InfrastructureError('Docker could not start grading sandbox')
              except subprocess.TimeoutExpired:
                  raise InfrastructureError('Sandbox startup or shutdown exceeded its deadline') from None
              finally:
                  subprocess.run(['docker', 'rm', '-f', name], stdout=subprocess.DEVNULL,
                                 stderr=subprocess.DEVNULL, timeout=15, env=clean_env())
              def read(name):
                  path = output / name
                  return path.read_bytes()[:OUTPUT_LIMIT].decode('utf-8', errors='replace') if path.exists() else ''
              return dict(exit_code=exit_code, duration_ms=round((time.monotonic()-started)*1000),
                          stdout=read('stdout'), stderr=read('stderr'), timed_out=(exit_code == 124),
                          truncated=any((output / name).exists() and (output / name).stat().st_size > OUTPUT_LIMIT
                                        for name in ('stdout','stderr')))

          def clean_env():
              return {'PATH': os.environ.get('PATH', '/usr/bin:/bin'), 'HOME': '/tmp', 'LANG': 'C.UTF-8'}

          def evaluate(testcase, execution):
              expected = str(testcase['output']).rstrip('\n')
              actual = execution['stdout'].rstrip('\n')
              if execution['timed_out']:
                  status = 'timeout'
              elif execution['exit_code'] != 0 or execution['truncated']:
                  status = 'error'
              else:
                  status = 'passed' if actual == expected else 'failed'
              return dict(id=str(testcase['id']), testcase_version=testcase.get('testcase_version'),
                          input=testcase['input'], expected_output=expected, actual_output=actual, status=status,
                          exit_code=execution['exit_code'], signal=(execution['exit_code']-128 if execution['exit_code']>128 else None),
                          stderr=execution['stderr'], duration_ms=execution['duration_ms'], timeout_ms=TIMEOUT_MS)

          def main():
              started = time.monotonic()
              git = lambda *args: subprocess.check_output(['git', *args], env=clean_env())
              message = git('show', '-s', '--format=%B', os.environ['GITHUB_SHA']).decode('utf-8').rstrip('\n')
              if message.startswith(('[config]', 'Initialize')):
                  print('Configuration commit: grading skipped')
                  return 0
              source = git('show', os.environ['GITHUB_SHA'] + ':main.c')
              if len(source) > 65536:
                  raise InfrastructureError('Source exceeds 64 KiB grading limit')
              branch = os.environ['GITHUB_REF'].removeprefix('refs/heads/')
              base_url = os.environ['HICOMMIT_API_BASE_URL'].rstrip('/')
              parsed = urllib.parse.urlparse(base_url)
              if parsed.scheme != 'https' or parsed.hostname != 'hicommit.com':
                  raise InfrastructureError('Unexpected HiCommit API origin')
              endpoint = base_url + '/problems/' + urllib.parse.quote(branch, safe='')
              payload = dict(problem=branch, actor=os.environ['GITHUB_ACTOR'], run_id=os.environ['GITHUB_RUN_ID'],
                             run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']), sha=os.environ['GITHUB_SHA'],
                             workflow_name=os.environ['GITHUB_WORKFLOW'], execution_environment='ubuntu-24.04/docker',
                             architecture=platform.machine(), runner_version='2.0.0', schema_version='1.0',
                             commit_message=message, code=base64.b64encode(source).decode('ascii'), status='pending')
              artifact = Path(os.environ['RUNNER_TEMP']) / 'hicommit-result'
              artifact.mkdir(exist_ok=True)
              (artifact / 'pending.json').write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
              try:
                  api('POST', endpoint + '/submission/result', payload)
              except InfrastructureError as error:
                  print(f'::warning::Pending callback unavailable: {error}; final callback will still be attempted')
              stage = 'prepare_sandbox'
              try:
                  subprocess.run(['docker', 'pull', IMAGE], check=True, timeout=180, env=clean_env(),
                                 stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
                  with tempfile.TemporaryDirectory(prefix='hicommit-') as work:
                      work = Path(work)
                      # Docker's unprivileged uid can traverse these dedicated directories only.
                      work.chmod(0o755)
                      source_dir, build_dir = work/'source', work/'build'
                      source_dir.mkdir(mode=0o755); build_dir.mkdir(mode=0o777); build_dir.chmod(0o777)
                      (source_dir/'main.c').write_bytes(source)
                      stage = 'compile'
                      compile_out = work/'compile'; compile_out.mkdir(mode=0o777); compile_out.chmod(0o777)
                      result = sandbox('gcc --version | head -n 1 > /results/version; '
                                       'exec gcc /source/main.c -o /work/program -std=c99 > /results/stdout 2>/results/stderr',
                                       [(source_dir,'/source','readonly'),(build_dir,'/work','readonly=false'),
                                        (compile_out,'/results','readonly=false')], compile_out, 45)
                      payload.update(compile_exit_code=result['exit_code'],compile_duration_ms=result['duration_ms'],
                                     compiler='gcc',compiler_version=(compile_out/'version').read_text().strip()[:255],
                                     compile_command='gcc /source/main.c -o /work/program -std=c99',
                                     compile_stdout=result['stdout'],compile_stderr=result['stderr'])
                      if result['timed_out']:
                          raise InfrastructureError('Compiler timeout')
                      if result['exit_code'] != 0:
                          payload['status'] = 'compile_error'
                      else:
                          stage = 'fetch_testcases'
                          cases = api('GET', endpoint + '/testcases')
                          if not isinstance(cases, list) or not cases:
                              raise InfrastructureError('No valid testcase set returned')
                          payload['testset_version'] = cases[0].get('testset_version')
                          if cases[0].get('problem_version'):
                              payload['problem_version'] = cases[0]['problem_version']
                          stage = 'run_tests'
                          results = []
                          for index, testcase in enumerate(cases):
                              out = work/f'test-{index}'; out.mkdir(mode=0o777); out.chmod(0o777)
                              execution = sandbox('start=$(date +%s%N); '
                                                  'timeout --kill-after=0.25s 2s /work/program > /results/stdout 2>/results/stderr; '
                                                  'status=$?; end=$(date +%s%N); '
                                                  'echo $(( (end-start)/1000000 )) > /results/duration_ms; exit "$status"',
                                                  [(build_dir,'/work','readonly'),(out,'/results','readonly=false')],
                                                  out, 20, (str(testcase['input']).rstrip('\n')+'\n').encode('utf-8'))
                              if (out/'duration_ms').exists():
                                  execution['duration_ms'] = int((out/'duration_ms').read_text().strip())
                              results.append(evaluate(testcase, execution))
                          passed = sum(t['status']=='passed' for t in results)
                          status = 'error' if any(t['status'] in ('error','timeout') for t in results) else (
                              'passed' if passed == len(results) else 'failed')
                          payload.update(status=status, result=results, pass_count=passed, total_count=len(results))
              except Exception as error:
                  # Infrastructure failures remain distinct from an incorrect student answer.
                  payload.update(status='error',error_type='infrastructure_error',error_stage=stage)
                  payload.pop('pass_count', None); payload.pop('total_count', None); payload.pop('result', None)
                  print(f'::error::Grading infrastructure failed at {stage}: {type(error).__name__}')
              payload['duration'] = round(time.monotonic()-started)
              # Durable artifact is prepared before trying to send the final callback.
              (artifact/'final.json').write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
              api('POST', endpoint + '/submission/result', payload)
              print(f'Final callback accepted: {payload["status"]}')
              return 1 if payload.get('error_type') == 'infrastructure_error' else 0

          if __name__ == '__main__':
              try:
                  sys.exit(main())
              except Exception as error:
                  print(f'::error::Runner could not complete: {type(error).__name__}: {error}')
                  sys.exit(1)
          PYTHON
      - name: Preserve callback payloads for diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hicommit-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hicommit-result/*.json
          retention-days: 7
          if-no-files-found: ignore
